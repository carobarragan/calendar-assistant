[package]
name = "calendar_ia"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
async-trait = "0.1"

log = "0.4.27"
axum = "0.6" # Asegúrate de usar una versión compatible
hyper = { version = "0.14.32", features = ["server"] }
tokio = { version = "1.0", features = ["full"] }



